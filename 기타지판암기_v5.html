<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기타 지판 외우기</title>
    <style>
        /* 기본 스타일 설정 */
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f4f4f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0 0 10px 0;
            color: #1a1a1a;
        }
        .header p {
            margin: 0;
            color: #666;
        }
        
        /* 진행률 및 타이머 영역 */
        .info-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }
        .progress {
            font-size: 20px;
            font-weight: bold;
            color: #007aff;
        }
        .timer {
            font-size: 18px;
            font-weight: bold;
            color: #ff3b30;
            background-color: #ffe5e5;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* 지판 영역 스타일 */
        .fretboard-wrapper {
            display: flex;
            flex-direction: column;
            margin: 20px 0;
            width: 100%;
            max-width: 800px;
        }
        .fret-numbers {
            display: grid;
            grid-template-columns: 40px repeat(12, 1fr);
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .fret-numbers div {
            grid-row: 1;
            grid-column: calc(var(--fret) + 1);
        }
        .fretboard-grid {
            display: grid;
            grid-template-columns: 40px repeat(12, 1fr);
            grid-template-rows: repeat(6, 40px);
            background-color: #4a3018;
            border: 2px solid #2c1a0a;
            border-radius: 4px;
            overflow: hidden;
        }
        .fret-cell {
            position: relative;
            border-right: 2px solid #b0b0b0;
            display: flex;
            align-items: center;
            justify-content: center;
            grid-row: var(--string);
            grid-column: calc(var(--fret) + 1);
        }
        .fret-cell.fret-0 {
            border-right: 4px solid #d4c3a3;
            background-color: #3a2210;
        }
        .fret-cell.fret-12 {
            border-right: none;
        }
        
        /* 기타 줄 표현 */
        .string-line {
            position: absolute;
            width: 100%;
            height: var(--thickness);
            background-color: #e8e8e8;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            z-index: 1;
        }

        /* 지판 마커 */
        .marker {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #d4c3a3;
            border-radius: 50%;
            z-index: 0;
        }
        .marker-single { transform: translateY(20px); }
        .marker-double { transform: translateY(20px); }

        /* 문제 출제 위치 강조 */
        .target-dot {
            position: absolute;
            width: 22px;
            height: 22px;
            background-color: #ff3b30;
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.8);
            display: none;
        }
        .fret-cell.active .target-dot { display: block; }
        .fret-cell.active.correct .target-dot {
            background-color: #34c759;
            box-shadow: 0 0 10px rgba(52, 199, 89, 0.8);
        }

        /* 정답 선택 버튼 영역 */
        .controls {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }
        .note-btn {
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .note-btn:hover { background-color: #f0f0f0; }
        .note-btn.correct { background-color: #34c759; color: white; border-color: #34c759; }
        .note-btn.wrong { background-color: #ff3b30; color: white; border-color: #ff3b30; }

        /* 정답 보기 버튼 */
        .action-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff9500;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .action-btn:hover { background-color: #e08300; }

        /* 결과 화면 모달 */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            max-width: 300px;
            width: 90%;
        }
        .modal-content h2 { margin-top: 0; color: #1a1a1a; }
        .modal-content p { font-size: 16px; margin: 10px 0; }
        .modal-content button {
            margin-top: 25px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .modal-content button:hover { background-color: #005bb5; }

        /* 모바일 세로 배치 반응형 스타일 */
        @media (max-width: 600px) {
            .fretboard-wrapper {
                flex-direction: row;
                justify-content: center;
            }
            .fret-numbers {
                grid-template-columns: 30px;
                grid-template-rows: 40px repeat(12, 1fr);
                margin-bottom: 0;
                margin-right: 5px;
            }
            .fret-numbers div {
                grid-column: 1;
                grid-row: calc(var(--fret) + 1);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .fretboard-grid {
                grid-template-columns: repeat(6, 1fr);
                grid-template-rows: 40px repeat(12, 1fr);
                width: 210px;
            }
            .fret-cell {
                grid-row: calc(var(--fret) + 1);
                grid-column: calc(7 - var(--string));
                border-right: none;
                border-bottom: 2px solid #b0b0b0;
            }
            .fret-cell.fret-0 {
                border-right: none;
                border-bottom: 4px solid #d4c3a3;
            }
            .fret-cell.fret-12 { border-bottom: none; }
            .string-line {
                width: var(--thickness);
                height: 100%;
            }
            .marker-single, .marker-double {
                transform: translateX(-17px);
            }
            .controls {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>이 음은 무엇일까요?</h1>
        <p>표시된 지판 위치를 보고 음 이름을 선택하세요.</p>
        <div class="info-bar">
            <div class="progress" id="progress">1 / 10</div>
            <div class="timer" id="timer">남은 시간: 15초</div>
        </div>
    </div>

    <!-- 지판이 그려질 영역 -->
    <div class="fretboard-wrapper" id="fretboard"></div>

    <!-- 정답 선택 버튼 영역 -->
    <div class="controls" id="controls"></div>

    <!-- 정답 보기 버튼 -->
    <button id="show-answer-btn" class="action-btn">정답 보기</button>

    <!-- 결과 화면 모달 -->
    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <h2>연습 완료! 🎸</h2>
            <p>첫 시도 정답: <strong id="score">0</strong> / 10</p>
            <p>정답 비율: <strong id="accuracy">0</strong>%</p>
            <p>총 틀린 횟수: <strong id="mistakes">0</strong>회</p>
            <button id="restart-btn">다시 연습하기</button>
        </div>
    </div>

    <script>
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const stringTuning = { 1: 4, 2: 11, 3: 7, 4: 2, 5: 9, 6: 4 };

        let questions = [];
        let currentQuestionIndex = 0;
        let isFirstAttempt = true;
        let score = 0;
        let mistakes = 0;
        let isWaiting = false; 
        
        // 타이머 관련 변수
        let timerInterval;
        let timeLeft = 15;

        function init() {
            generateQuestions();
            renderFretboard();
            renderButtons();
            showQuestion();
            
            // 정답 보기 버튼 이벤트 연결
            document.getElementById('show-answer-btn').onclick = handleTimeoutOrShowAnswer;
        }

        // 10개의 문제 생성 로직
        function generateQuestions() {
            questions = [];
            let usedStrings = new Set();
            let prevString = -1, prevFret = -1;
            
            while (questions.length < 10) {
                let string = Math.floor(Math.random() * 6) + 1;
                let fret = Math.floor(Math.random() * 13);
                
                let remaining = 10 - questions.length;
                let unused = [1, 2, 3, 4, 5, 6].filter(s => !usedStrings.has(s));
                if (unused.length >= remaining) {
                    string = unused[0];
                }
                
                if (string === prevString && fret === prevFret) continue;
                
                let noteIndex = (stringTuning[string] + fret) % 12;
                questions.push({ string, fret, answer: notes[noteIndex] });
                
                usedStrings.add(string);
                prevString = string;
                prevFret = fret;
            }
        }

        function renderFretboard() {
            const fretboard = document.getElementById('fretboard');
            fretboard.innerHTML = '';
            
            const numbers = document.createElement('div');
            numbers.className = 'fret-numbers';
            for (let i = 0; i <= 12; i++) {
                const num = document.createElement('div');
                num.style.setProperty('--fret', i);
                num.textContent = i;
                numbers.appendChild(num);
            }
            fretboard.appendChild(numbers);
            
            const board = document.createElement('div');
            board.className = 'fretboard-grid';
            
            for (let s = 1; s <= 6; s++) {
                let thickness = [1, 1.5, 2, 2.5, 3, 3.5][s-1] + 'px';
                
                for (let f = 0; f <= 12; f++) {
                    const cell = document.createElement('div');
                    cell.className = `fret-cell fret-${f} string-${s}`;
                    cell.style.setProperty('--string', s);
                    cell.style.setProperty('--fret', f);
                    cell.style.setProperty('--thickness', thickness);
                    cell.id = `cell-${s}-${f}`;
                    
                    const stringLine = document.createElement('div');
                    stringLine.className = 'string-line';
                    cell.appendChild(stringLine);
                    
                    if (s === 3 && [3, 5, 7, 9].includes(f)) {
                        const marker = document.createElement('div');
                        marker.className = 'marker marker-single';
                        cell.appendChild(marker);
                    }
                    if ((s === 2 || s === 4) && f === 12) {
                        const marker = document.createElement('div');
                        marker.className = 'marker marker-double';
                        cell.appendChild(marker);
                    }
                    
                    const targetDot = document.createElement('div');
                    targetDot.className = 'target-dot';
                    cell.appendChild(targetDot);
                    
                    board.appendChild(cell);
                }
            }
            fretboard.appendChild(board);
        }

        function renderButtons() {
            const controls = document.getElementById('controls');
            controls.innerHTML = '';
            notes.forEach(note => {
                const btn = document.createElement('button');
                btn.className = 'note-btn';
                btn.textContent = note;
                btn.onclick = () => handleGuess(note, btn);
                controls.appendChild(btn);
            });
        }

        // 타이머 시작 함수
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 15;
            document.getElementById('timer').textContent = `남은 시간: ${timeLeft}초`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = `남은 시간: ${timeLeft}초`;
                
                if (timeLeft <= 0) {
                    handleTimeoutOrShowAnswer();
                }
            }, 1000);
        }

        function showQuestion() {
            document.querySelectorAll('.fret-cell.active').forEach(el => {
                el.classList.remove('active', 'correct');
            });
            
            // 새 문제가 나올 때 모든 버튼의 상태와 숨김 처리를 초기화합니다.
            document.querySelectorAll('.note-btn').forEach(btn => {
                btn.classList.remove('correct', 'wrong');
                btn.style.visibility = 'visible'; // 숨겨졌던 버튼 다시 표시
            });
            
            const q = questions[currentQuestionIndex];
            const cell = document.getElementById(`cell-${q.string}-${q.fret}`);
            cell.classList.add('active');
            
            isFirstAttempt = true;
            isWaiting = false;
            document.getElementById('progress').textContent = `${currentQuestionIndex + 1} / 10`;
            
            // 문제 표시와 함께 타이머 시작
            startTimer();
        }

        function handleGuess(note, btn) {
            if (isWaiting) return; 
            
            const q = questions[currentQuestionIndex];
            if (note === q.answer) {
                clearInterval(timerInterval); // 정답을 맞히면 타이머 정지
                
                btn.classList.add('correct');
                const cell = document.getElementById(`cell-${q.string}-${q.fret}`);
                cell.classList.add('correct'); 
                
                if (isFirstAttempt) score++;
                isWaiting = true;
                
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < 10) {
                        showQuestion();
                    } else {
                        showResult();
                    }
                }, 800);
            } else {
                if (!btn.classList.contains('wrong')) {
                    btn.classList.add('wrong');
                    if (isFirstAttempt) {
                        isFirstAttempt = false; 
                    }
                    mistakes++;

                    // 1초(1000ms) 뒤에 오답 버튼 자체를 화면에서 숨김(소거)
                    // visibility: hidden을 사용하여 레이아웃(버튼들의 위치)이 틀어지지 않게 합니다.
                    setTimeout(() => {
                        btn.style.visibility = 'hidden';
                    }, 1000);
                }
            }
        }

        // 시간 초과 또는 정답 보기 버튼 클릭 시 실행되는 함수
        function handleTimeoutOrShowAnswer() {
            if (isWaiting) return; // 이미 정답을 맞혀 대기 중이면 무시
            
            clearInterval(timerInterval); // 타이머 정지
            
            // 오답 처리 (첫 시도였다면 실패로 간주하고 틀린 횟수 증가)
            if (isFirstAttempt) {
                isFirstAttempt = false;
                mistakes++;
            }
            
            const q = questions[currentQuestionIndex];
            
            // 정답 버튼을 찾아서 초록색으로 표시
            document.querySelectorAll('.note-btn').forEach(btn => {
                if (btn.textContent === q.answer) {
                    btn.classList.add('correct');
                }
            });
            
            // 지판의 정답 위치도 초록색으로 표시
            const cell = document.getElementById(`cell-${q.string}-${q.fret}`);
            cell.classList.add('correct');
            
            isWaiting = true;
            
            // 사용자가 정답을 확인할 수 있도록 1.5초 대기 후 다음 문제로 이동
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < 10) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1500);
        }

        function showResult() {
            clearInterval(timerInterval); // 혹시 모를 타이머 동작 방지
            document.getElementById('score').textContent = score;
            document.getElementById('accuracy').textContent = ((score / 10) * 100).toFixed(0);
            document.getElementById('mistakes').textContent = mistakes;
            document.getElementById('result-modal').classList.remove('hidden');
        }

        function restart() {
            currentQuestionIndex = 0;
            score = 0;
            mistakes = 0;
            document.getElementById('result-modal').classList.add('hidden');
            generateQuestions();
            showQuestion();
        }

        window.onload = () => {
            init();
            document.getElementById('restart-btn').onclick = restart;
        };
    </script>
</body>
</html>
